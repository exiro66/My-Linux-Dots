# ========================== CONFIG FOR LOCKLIKE =============================
[General]
#! SystemInfo (overriden by sync script ignore)
os=Arch
host=localhost

# ============================================================================
# Clock
# ============================================================================
# 12 hours or 24 Hours true=12 [true | false]
ap=false

# ============================================================================
# WELCOME MESSAGE
# ============================================================================
# Enable welcome message [true | false]
enableWelcomeMessage=true

# Welcome message background opacity [0.0 to 1.0]
welcomeBgBlurAmount=0.7
welcomeColorOpacity=0.7
# mainCard background opacity and blur [0.0 to 2.0]
mainCardBlurAmount=0.9
mainCardColorOpacity=0.9
mainCardComponentsOpacity=0.9
# Welcome message background blur [true | false]
welcomeBgBlur=true
mainCardBgBlur=true
sessionPicker=false

# ============================================================================
# AVATAR
# ============================================================================
# Avatar shape [hexagon | circle]
# hexagon: hexagonal Material Design blob shape (default)
# circle: circular crop
AvatarShape=hexagon

# ============================================================================
# COLOR SCHEME
# ============================================================================
background=#000000
mainCard=#0a0a0a
subComponents=#121212
text=#ffffff
textDark=#aaaaaa
primary=#ffffff
onPrimary=#000000
secondary=#eeeeee
onSecondary=#111111
tertiary=#cccccc
onTertiary=#222222
onSuccess=#ffffff
inverseOnSurface=#333333
surface=#000000
surfaceVariant=#1a1a1a
surfaceContainerLow=#050505
surfaceContainer=#121212
surfaceContainerHigh=#1f1f1f
outline=#444444
error=#ffffff

# ============================================================================
# WALLPAPER CUSTOM
# ============================================================================
Background="background.png"
