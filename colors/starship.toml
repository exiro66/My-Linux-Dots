add_newline = false

format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:#edc7db'

[character]
success_symbol = "[ ](bold fg:#AE9AD5)"
error_symbol = "[ ](bold fg:#7F95E0)"

[package]
disabled = true

[git_branch]
style = "bg:#060405"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:#060405)[$symbol $branch(:$remote_branch)](fg:#AE9AD5 bg:#060405)[ ](bold fg:#060405)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[•$hostname](bg:#060405 bold fg:#AE9AD5)[](bold fg:#060405)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:#060405 fg:#AE9AD5"
style_root = "red bold"
format = "[](bold fg:#060405)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#060405 fg:#AE9AD5"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:#060405)[󰉋 → $path]($style)[](bold fg:#060405)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#060405)[󰪢 $duration](bold bg:#060405 fg:#AE9AD5)[](bold fg:#060405)'
