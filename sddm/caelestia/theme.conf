# ========================== CONFIG FOR LOCKLIKE =============================
[General]
#! SystemInfo (overriden by sync script ignore)
os=Arch
host=localhost

# ============================================================================
# Clock
# ============================================================================
# 12 hours or 24 Hours true=12 [true | false]
ap=false

# ============================================================================
# WELCOME MESSAGE
# ============================================================================
# Enable welcome message [true | false]
enableWelcomeMessage=true

# Welcome message background opacity [0.0 to 1.0]
welcomeBgBlurAmount=0.7
welcomeColorOpacity=0.7
# mainCard background opacity and blur [0.0 to 2.0]
mainCardBlurAmount=0.9
mainCardColorOpacity=0.9
mainCardComponentsOpacity=0.9
# Welcome message background blur [true | false]
welcomeBgBlur=true
mainCardBgBlur=true
sessionPicker=false

# ============================================================================
# AVATAR
# ============================================================================
# Avatar shape [hexagon | circle]
# hexagon: hexagonal Material Design blob shape (default)
# circle: circular crop
AvatarShape=hexagon

# ============================================================================
# COLOR SCHEME
# ============================================================================
background=#0A1126
mainCard=#0F1B40
subComponents=#152850
text=#e0e6f5
textDark=#99B6F2
primary=#99B6F2
onPrimary=#0A1126
secondary=#5581D9
onSecondary=#ffffff
tertiary=#4E6BA6
onTertiary=#ffffff
onSuccess=#ffffff
inverseOnSurface=#e0e6f5
surface=#0A1126
surfaceVariant=#0F1B40
surfaceContainerLow=#0A1126
surfaceContainer=#0F1B40
surfaceContainerHigh=#152850
outline=#2a4a7a
error=#ffffff

# ============================================================================
# WALLPAPER CUSTOM
# ============================================================================
Background="background.png"
