# ========================== CONFIG FOR LOCKLIKE =============================
[General]
#! SystemInfo (overriden by sync script ignore)
os=Arch
host=localhost

# ============================================================================
# Clock
# ============================================================================
# 12 hours or 24 Hours true=12 [true | false]
ap=false

# ============================================================================
# WELCOME MESSAGE
# ============================================================================
# Enable welcome message [true | false]
enableWelcomeMessage=true

# Welcome message background opacity [0.0 to 1.0]
welcomeBgBlurAmount=0.7
welcomeColorOpacity=0.7
# mainCard background opacity and blur [0.0 to 2.0]
mainCardBlurAmount=0.9
mainCardColorOpacity=0.9
mainCardComponentsOpacity=0.9
# Welcome message background blur [true | false]
welcomeBgBlur=true
mainCardBgBlur=true
sessionPicker=false

# ============================================================================
# AVATAR
# ============================================================================
# Avatar shape [hexagon | circle]
# hexagon: hexagonal Material Design blob shape (default)
# circle: circular crop
AvatarShape=hexagon

# ============================================================================
# COLOR SCHEME
# ============================================================================
background=#101418
mainCard=#181c20
subComponents=#1c2024
text=#e0e2e8
textDark=#b8c8da
primary=#98ccf9
onPrimary=#003351
secondary=#b8c8da
onSecondary=#23323f
tertiary=#d1bfe7
onTertiary=#372a4a
onSuccess=#ffffff
inverseOnSurface=#e0e2e8
surface=#101418
surfaceVariant=#42474e
surfaceContainerLow=#181c20
surfaceContainer=#1c2024
surfaceContainerHigh=#262a2e
outline=#8c9199
error=#ffb4ab

# ============================================================================
# WALLPAPER CUSTOM
# ============================================================================
Background="background.png"
