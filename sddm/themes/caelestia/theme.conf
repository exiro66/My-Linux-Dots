# ========================== CONFIG FOR LOCKLIKE =============================
[General]
#! SystemInfo (overriden by sync script ignore)
os=Arch
host=localhost

# ============================================================================
# Clock
# ============================================================================
# 12 hours or 24 Hours true=12 [true | false]
ap=false

# ============================================================================
# WELCOME MESSAGE
# ============================================================================
# Enable welcome message [true | false]
enableWelcomeMessage=true

# Welcome message background opacity [0.0 to 1.0]
welcomeBgBlurAmount=0.7
welcomeColorOpacity=0.7
# mainCard background opacity and blur [0.0 to 2.0]
mainCardBlurAmount=0.9
mainCardColorOpacity=0.9
mainCardComponentsOpacity=0.9
# Welcome message background blur [true | false]
welcomeBgBlur=true
mainCardBgBlur=true
sessionPicker=false

# ============================================================================
# AVATAR
# ============================================================================
# Avatar shape [hexagon | circle]
# hexagon: hexagonal Material Design blob shape (default)
# circle: circular crop
AvatarShape=hexagon

# ============================================================================
# COLOR SCHEME
# ============================================================================
background=#181926
mainCard=#1e2030
subComponents=#24273a
text=#cad3f5
textDark=#a5adcb
primary=#b7bdf8
onPrimary=#1e2030
secondary=#8aadf4
onSecondary=#1e2030
tertiary=#f5bde6
onTertiary=#1e2030
onSuccess=#ffffff
inverseOnSurface=#cad3f5
surface=#24273a
surfaceVariant=#363a4f
surfaceContainerLow=#181926
surfaceContainer=#1e2030
surfaceContainerHigh=#24273a
outline=#494d64
error=#ffb4ab

# ============================================================================
# WALLPAPER CUSTOM
# ============================================================================
Background="background.png"
