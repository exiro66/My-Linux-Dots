# ============================================
# Fondo: screenshot con blur
# ============================================
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 12
    noise = 0.02
    contrast = 1.0
    brightness = 0.5
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# ============================================
# Campo de contraseña
# ============================================
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(ffffffff)
    inner_color = rgba(000000cc)
    font_color = rgba(ffffffff)
    placeholder_text = Contraseña...
    fail_text = Error

    fade_on_empty = false
    hide_input = false

    position = 0, 0
    halign = center
    valign = center
}
